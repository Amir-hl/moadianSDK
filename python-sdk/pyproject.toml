[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-collect-data-sdk"
version = "0.1.0"
description = "Python SDK for Iran's electronic tax invoice API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42",
  "jwcrypto>=1.5",
  "pydantic>=2.7,<3",
  "simplejson>=3.19,<4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
